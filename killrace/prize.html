<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>킬내기 앱 | 내 상금</title>
<meta name="description" content="GmI 킬내기 상금. 회차별 적립과 지급 기록을 보고 3만 원부터 지급을 요청해요.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F6F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="app.css">
<style>/* 공통 토큰은 app.css · 본문 글꼴만 여기 한 줄(검사기가 외부 파일을 못 본다) */body{font-family:'Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif;}.brand,.num,.balance .amt{font-family:'Saira Condensed','Pretendard Variable',sans-serif;}</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="brand" href="./">킬내기 <span>앱</span></a><div class="who" id="who"></div></div></header>
<nav class="tabs"><a class="tab" href="./">내 계정</a><a class="tab on" href="prize.html">내 상금</a></nav>

<main aria-live="polite">
  <section class="card" id="gate" hidden><div class="empty" id="gateBody"></div></section>

  <section class="card" id="mine" hidden>
    <h2 class="card-h">내 상금</h2>
    <p class="card-sub">적립과 지급은 서버 기록 그대로예요. 계좌는 여기에 없어요</p>
    <div class="balance">
      <div><div class="amt num" id="balance"></div><div class="sub" id="balSub"></div></div>
      <div id="action"></div>
    </div>
    <p class="note" id="actionNote"></p>
    <p class="msg" id="mineMsg" role="status"></p>
    <ul class="lines" id="lines"></ul>
  </section>

  <section class="card" id="owner" hidden>
    <h2 class="card-h">지급 대기</h2>
    <p class="card-sub">송금한 뒤 「지급 완료」를 눌러 주세요. 되돌릴 수 없어요</p>
    <div class="totals" id="totals"></div>
    <div id="pending"></div>
    <p class="msg" id="ownerMsg" role="status"></p>
    <details style="margin-top:12px;"><summary style="cursor:pointer;font-weight:700;font-size:14px;">최근 지급 완료</summary><ul class="lines" id="recent"></ul></details>
    <details style="margin-top:8px;" id="playersBox"><summary style="cursor:pointer;font-weight:700;font-size:14px;" id="playersSum">선수별 잔액</summary><p class="note">「본인 확인」은 디스코드 이름이 그 스팀 닉의 주인과 맞을 때만 눌러 주세요. 눌러야 그 선수의 지급 요청이 열려요</p><ul class="players" id="players"></ul></details>
  </section>
</main>
<p class="foot"><a href="../killnaegi-board.html">점수판</a> · <a href="../killnaegi.html">신청</a></p>

<script src="app.js"></script>
<script>
/* 내 상금(§1.20) — 잔액 · 요청 가능 여부 · 회차별 줄은 전부 서버 값이다(앱이 계산하지 않는다).
 * 「지급 요청」은 잔액 전액 한 건. 오너로 로그인하면 「지급 대기」가 아래에 더 보인다(prize/admin 이 200 일 때만). */
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = KR.esc, won = KR.won, when = KR.when;
  var P = null, A = null, busy = false;

  var REASON = {
    below_min: function (d) { return "3만 원부터 요청할 수 있어요 (지금 " + won(d.balance) + ")"; },
    open_request: function () { return "요청이 접수됐어요. 송금되면 알려 드려요"; },
    not_linked: function () { return "스팀 닉을 연결하면 내 상금이 보여요"; },
    not_verified: function (d) { return "본인 확인이 끝나면 요청할 수 있어요" + (d.short > 0 ? " (3만 원까지 " + won(d.short) + " 남았어요)" : ""); }
  };
  // 막힌 이유마다 창구 한 줄 — 누가 풀어 주는지
  var HELP = {
    not_verified: "진행자가 디스코드 이름과 스팀 닉을 맞춰 보고 확인해요. 오래 걸리면 디스코드에서 진행자에게 알려 주세요",
    below_min: "대회 상금이 쌓이면 이 화면에서 바로 요청할 수 있어요"
  };
  function lineHtml(l) {
    if (l.kind === "accrue") {
      return '<li class="line"><span class="t">' + esc(l.eventName || (l.event != null ? l.event + "회" : "적립")) + '</span><span class="a num plus">+' + won(l.amount) + '</span><span class="s">' + esc(l.reason || "상금") + (l.at ? " · " + when(l.at) : "") + "</span></li>";
    }
    var st = l.status === "paid" ? '<span class="tag paid">지급 완료</span>' : l.status === "cancelled" ? '<span class="tag cancel">취소</span>' : '<span class="tag req">요청 중</span>';
    var sub = l.status === "paid" ? "지급 " + when(l.paidAt || l.at) : l.status === "cancelled" ? "취소 " + when(l.at) : "요청 " + when(l.requestedAt || l.at);
    return '<li class="line"><span class="t">지급' + st + '</span><span class="a num minus">' + (l.status === "cancelled" ? "" : "−") + won(l.amount) + '</span><span class="s">' + sub + "</span></li>";
  }
  function renderMine() {
    var d = P;
    if (!d.linked) {
      $("balance").textContent = "–"; $("balSub").textContent = "";
      $("action").innerHTML = ""; $("actionNote").innerHTML = REASON.not_linked() + ' <a href="./">내 계정</a>';
      $("lines").innerHTML = ""; return;
    }
    $("balance").innerHTML = Number(d.balance).toLocaleString("ko-KR") + "<small>원</small>";
    $("balSub").textContent = "적립 " + won(d.accrued) + " · 지급 " + won(d.paid);
    if (d.canRequest) {
      $("action").innerHTML = '<button type="button" class="chip go" id="reqBtn">지급 요청</button>';
      $("actionNote").textContent = "잔액 " + won(d.balance) + " 전액을 요청해요. 송금되면 알려 드려요";
      $("reqBtn").addEventListener("click", request);
    } else if (d.reason === "open_request") {
      $("action").innerHTML = '<span class="chip wait">요청 접수됐어요</span>';
      $("actionNote").textContent = d.open ? won(d.open.amount) + " · " + when(d.open.at) + " 요청" : "";
    } else {
      $("action").innerHTML = "";
      var empty = !(d.lines || []).length && !d.balance;
      $("actionNote").textContent = empty ? "" : (REASON[d.reason] || function () { return "지금은 요청할 수 없어요"; })(d);
      if (!empty && HELP[d.reason]) $("actionNote").insertAdjacentHTML("beforeend", '<span class="help">' + esc(HELP[d.reason]) + "</span>");
    }
    $("lines").innerHTML = (d.lines || []).length ? d.lines.map(lineHtml).join("") : '<li class="muted" style="padding:8px 0;">아직 적립된 상금이 없어요</li>';
  }
  var REQ_ERR = {
    open_request: "이미 요청이 접수돼 있어요",
    below_min: "3만 원부터 요청할 수 있어요",
    not_verified: "본인 확인이 끝나면 요청할 수 있어요",
    not_linked: "스팀 닉을 먼저 연결해 주세요",
    rate_limited: "너무 자주 눌렀어요. 잠시 뒤 다시 해 주세요",
    network: "서버에 닿지 않았어요. 잠시 뒤 다시 해 주세요"
  };
  function request() {
    if (busy) return;
    if (!confirm("잔액 " + won(P.balance) + " 전액을 지급 요청할까요?")) return;
    busy = true; $("reqBtn").disabled = true; $("mineMsg").className = "msg"; $("mineMsg").textContent = "";
    KR.api("/api/killrace/me/prize/request", {}).then(function (r) {
      busy = false;
      if (r.ok) {
        $("mineMsg").className = "msg ok";
        $("mineMsg").textContent = r.body.notified ? "요청했어요. 오너에게 알림이 갔어요" : "요청했어요. 알림은 못 보냈지만 요청은 남아 있어요";
        return loadMine();
      }
      $("reqBtn").disabled = false;
      $("mineMsg").textContent = REQ_ERR[r.code] || "요청하지 못했어요. 잠시 뒤 다시 해 주세요";
      if (/^(open_request|below_min|not_verified|not_linked)$/.test(r.code || "")) loadMine();
    });
  }
  function loadMine() {
    return KR.api("/api/killrace/me/prize").then(function (r) {
      if (r.status === 401) { gate("로그인이 필요해요", '<button type="button" class="btn main" data-act="login" style="margin-top:10px;">디스코드로 로그인</button>'); return; }
      if (r.code === "not_member") { gate("먼저 동의가 필요해요", '<a class="btn main" href="./" style="margin-top:10px;">내 계정으로</a>'); return; }
      if (!r.ok) { gate(r.code === "table_missing" ? "아직 준비 중이에요" : "불러오지 못했어요", "잠시 뒤 다시 열어 주세요. 계속 안 되면 디스코드에서 진행자에게 알려 주세요"); return; }
      P = r.body; $("gate").hidden = true; $("mine").hidden = false; renderMine();
      KR.header(P.ign || "");
    });
  }
  function gate(title, body) { $("gate").hidden = false; $("mine").hidden = true; $("gateBody").innerHTML = "<b>" + esc(title) + "</b>" + body; KR.header(""); }

  // ── 오너 ──
  function renderOwner() {
    var a = A;
    $("totals").innerHTML = [["적립", a.totals.accrued], ["지급", a.totals.paid], ["요청 중", a.totals.requested]].map(function (x) { return '<div class="tot"><b>' + won(x[1]) + "</b><span>" + x[0] + "</span></div>"; }).join("");
    $("pending").innerHTML = a.pending.length ? a.pending.map(function (p) {
      return '<div class="pend"><div class="pend-h"><b>' + esc(p.ign) + (p.notified ? "" : ' <span class="tag nonoti">알림 안 감</span>') + '</b><span class="num">' + won(p.amount) + "</span></div>" +
        '<div class="per">' + (p.perEvent || []).map(function (e) { return esc(e.name || e.event + "회") + " " + won(e.amount); }).join(" · ") + (p.requestedAt ? " · 요청 " + when(p.requestedAt) : "") + "</div>" +
        '<div class="row"><button type="button" class="btn main" data-pay="' + p.id + '" data-ign="' + esc(p.ign) + '" data-amt="' + p.amount + '">지급 완료</button><button type="button" class="btn line" data-cancel="' + p.id + '" data-ign="' + esc(p.ign) + '">요청 취소</button></div></div>';
    }).join("") : '<div class="empty"><b>지급 대기 0건</b>요청이 들어오면 여기에 보여요</div>';
    $("recent").innerHTML = a.recent.length ? a.recent.map(function (r) {
      return '<li class="line"><span class="t">' + esc(r.ign) + (r.notified ? "" : ' <span class="tag nonoti">알림 안 감</span>') + '</span><span class="a num minus">' + won(r.amount) + '</span><span class="s">' + when(r.paidAt) + (r.memo ? " · " + esc(r.memo) : "") + "</span></li>";
    }).join("") : '<li class="muted" style="padding:8px 0;">아직 없어요</li>';
    var waiting = 0;
    $("players").innerHTML = a.players.length ? a.players.map(function (p) {
      var st = p.canRequest ? "요청 가능" : p.reason === "open_request" ? "요청 중" : p.reason === "not_verified" ? "본인 확인 전" : p.reason === "below_min" ? "3만 원까지 " + won(p.short) : "";
      var m = p.member, who, act = "";
      if (!m) who = "앱 연결 전";
      else if (m.verifiedAt) {
        who = "디스코드 " + esc(m.name || "이름 없음") + " · 확인 " + esc(m.verifiedBy || "") + " " + when(m.verifiedAt);
        act = '<button type="button" class="btn line sm" data-unverify="' + esc(p.key) + '" data-ign="' + esc(p.ign) + '">확인 풀기</button>';
      } else {
        waiting++;
        who = "디스코드 " + esc(m.name || "이름 없음") + " · 연결 " + when(m.linkedAt);
        act = '<button type="button" class="btn main sm" data-verify="' + esc(p.key) + '" data-ign="' + esc(p.ign) + '" data-name="' + esc(m.name || "이름 없음") + '">본인 확인</button>';
      }
      return '<li><div class="pl"><b>' + esc(p.ign) + "</b><span>" + won(p.balance) + (st ? " · " + st : "") + '</span><span class="who-line">' + who + "</span></div>" + act + "</li>";
    }).join("") : '<li class="muted" style="padding:8px 0;">아직 없어요</li>';
    $("playersSum").textContent = "선수별 잔액" + (waiting ? " · 본인 확인 대기 " + waiting + "명" : "");
    if (waiting) $("playersBox").open = true;
  }
  function loadOwner() {
    return KR.api("/api/killrace/prize/admin").then(function (r) {
      if (!r.ok) { $("owner").hidden = true; return; }        // 오너가 아니면 403 — 조용히 숨긴다
      A = r.body; $("owner").hidden = false; renderOwner();
    });
  }
  var VERIFY_ERR = { not_linked: "그 닉을 연결한 앱 회원이 없어요", host_only: "오너나 진행자만 할 수 있어요", table_missing: "본인 확인 표가 아직 없어요" };
  document.addEventListener("click", function (ev) {
    var v = ev.target.closest("[data-verify],[data-unverify]"); if (!v || busy) return;
    var on = v.hasAttribute("data-verify"), key = v.getAttribute(on ? "data-verify" : "data-unverify"), ign = v.getAttribute("data-ign");
    var ok = on ? confirm("디스코드 " + v.getAttribute("data-name") + " 님이 " + ign + " 의 주인이 맞나요?\n확인하면 이 선수의 지급 요청이 열려요") : confirm(ign + " 의 본인 확인을 풀까요? 지급 요청이 다시 잠겨요");
    if (!ok) return;
    busy = true; v.disabled = true; $("ownerMsg").className = "msg"; $("ownerMsg").textContent = "";
    KR.api("/api/killrace/prize/admin", { action: on ? "verify" : "unverify", key: key }).then(function (r) {
      busy = false;
      if (r.ok) { $("ownerMsg").className = "msg ok"; $("ownerMsg").textContent = on ? ign + " 본인 확인했어요" : ign + " 본인 확인을 풀었어요"; }
      else { v.disabled = false; $("ownerMsg").textContent = VERIFY_ERR[r.code] || "처리하지 못했어요. 잠시 뒤 다시 해 주세요"; }
      return loadOwner();
    });
  });
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-pay],[data-cancel]"); if (!b || busy) return;
    var pay = b.hasAttribute("data-pay"), id = Number(b.getAttribute(pay ? "data-pay" : "data-cancel"));
    var ok = pay ? confirm(b.getAttribute("data-ign") + " 에게 " + won(b.getAttribute("data-amt")) + " 송금을 마쳤나요?\n지급 완료는 되돌릴 수 없어요") : confirm(b.getAttribute("data-ign") + " 의 요청을 취소할까요? 잔액은 그대로 남아요");
    if (!ok) return;
    busy = true; b.disabled = true; $("ownerMsg").className = "msg"; $("ownerMsg").textContent = "";
    KR.api("/api/killrace/prize/admin", { action: pay ? "paid" : "cancel", id: id }).then(function (r) {
      busy = false;
      if (r.ok) { $("ownerMsg").className = "msg ok"; $("ownerMsg").textContent = pay ? (r.body.notified ? "지급 완료로 기록했어요. 선수에게 알림이 갔어요" : "지급 완료로 기록했어요. 선수 알림은 못 보냈어요") : "요청을 취소했어요"; }
      else { b.disabled = false; $("ownerMsg").textContent = r.code === "not_requested" ? "이미 처리된 요청이에요" : r.code === "not_found" ? "그 요청을 못 찾았어요" : "처리하지 못했어요. 잠시 뒤 다시 해 주세요"; }
      return Promise.all([loadOwner(), KR.token() ? loadMine() : null]);
    });
  });

  if (!KR.token()) { gate("로그인이 필요해요", '<button type="button" class="btn main" data-act="login" style="margin-top:10px;">디스코드로 로그인</button>'); }
  else { loadMine().then(loadOwner); }
})();
</script>
</body>
</html>
