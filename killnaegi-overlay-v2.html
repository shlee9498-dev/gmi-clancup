<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>킬내기 | 방송 오버레이 v2</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* OBS 브라우저 소스용 v2 — 배경 투명. killnaegi-overlay.html(v1)과 같은 판 · 같은 글꼴 · 같은 노랑 강조를 쓰고,
   팀마다 킬 · 딜 · 점수를 칸으로 나눠 크게 보여 준다. 6팀까지 한 화면 · 맨 아래 개인 MVP 한 줄.
   권장 크기 640 × 720(1920 화면에서 확대 없이 읽힌다). 더 크게 쓰려면 주소 뒤에 ?scale=1.3 */
:root{
  --panel:#101724; --panel-2:#1A2333; --ink:#FFFFFF; --dim:#B6C0D0; --faint:#8894A8;
  --sun:#FFB020; --up:#3DDC97; --down:#FF6B5E; --accent:#6EA0FF;
  --display:'Saira Condensed','Pretendard Variable',sans-serif;
  --body:'Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif;
  --cols:42px minmax(0,1fr) 64px 104px 104px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:transparent;}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;}
.board{width:640px;transform-origin:top left;padding:6px;}
.head{background:var(--panel);border-radius:14px 14px 0 0;padding:14px 18px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.title{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;}
.title span{color:var(--sun);}
.clock{font-size:16px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;}
.clock b{color:var(--ink);font-weight:800;}
.rows{background:var(--panel);padding:0 10px 6px;}
.cols,.row{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:10px;}
.cols{padding:2px 14px 4px 6px;font-size:14px;font-weight:800;color:var(--faint);letter-spacing:.02em;}
.cols span:nth-child(n+3){text-align:right;}
.row{background:var(--panel-2);border-radius:10px;padding:7px 14px 7px 6px;margin-top:5px;min-height:62px;}
.row.first{outline:2px solid var(--sun);outline-offset:-2px;}
.rk{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-align:center;}
.row.first .rk{color:var(--sun);}
.who{min-width:0;}
.name{font-weight:800;font-size:23px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.meta{font-size:13.5px;font-weight:600;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb{display:inline-block;margin-right:6px;padding:1px 7px 2px;border-radius:999px;background:var(--sun);color:#1B1300;font-size:12.5px;font-weight:800;line-height:1.3;vertical-align:1px;}
.move{font-size:14px;font-weight:800;margin-left:6px;}
.move.up{color:var(--up);} .move.down{color:var(--down);}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right;line-height:1;white-space:nowrap;}
.k{font-weight:800;font-size:34px;}
.d{font-weight:700;font-size:30px;color:var(--dim);}
.pts{font-weight:800;font-size:46px;}
.pv{margin-left:8px;font-weight:800;color:var(--dim);}
.foot{background:var(--panel);border-radius:0 0 14px 14px;padding:10px 18px 12px;font-size:15px;font-weight:600;color:var(--dim);display:flex;justify-content:space-between;gap:12px;white-space:nowrap;}
.foot b{color:var(--accent);font-weight:800;}
.mvp{margin-top:8px;background:var(--panel);border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:14px;white-space:nowrap;}
.mvp .tag{background:var(--sun);color:#1B1300;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;border-radius:8px;padding:6px 10px 5px;}
.mvp .ign{font-weight:800;font-size:26px;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.mvp .line{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;}
.mvp .line small{font-family:var(--body);font-size:15px;font-weight:700;color:var(--dim);margin:0 6px;}
.mvp .team{margin-left:auto;font-size:15px;font-weight:700;color:var(--dim);}
.toast{margin-top:12px;background:var(--sun);color:#1B1300;border-radius:12px;padding:10px 16px;font-weight:800;font-size:24px;display:flex;justify-content:space-between;align-items:baseline;opacity:0;transform:translateY(-6px);}
.toast.show{opacity:1;transform:none;}
.toast .n{font-family:var(--display);font-size:34px;line-height:1;}
.toast.down{background:var(--down);color:#fff;}
@media (prefers-reduced-motion:no-preference){ .toast{transition:opacity .25s ease-out,transform .25s ease-out;} }
[hidden]{display:none !important;}
</style>
</head>
<body>
<div class="board" id="board" hidden>
  <div class="head"><div class="title">킬내기 <span id="evRound"></span></div><div class="clock" id="clock"></div></div>
  <div class="rows">
    <div class="cols" aria-hidden="true"><span></span><span>팀</span><span>킬</span><span>딜</span><span>점수</span></div>
    <div id="rows"></div>
  </div>
  <div class="foot"><span id="footL"></span><span id="footR"></span></div>
  <div class="mvp" id="mvp" hidden><span class="tag">MVP</span><span class="ign" id="mvpIgn"></span><span class="line" id="mvpLine"></span><span class="team" id="mvpTeam"></span></div>
  <div class="toast" id="toast" aria-live="polite"><span id="toastName"></span><span class="n" id="toastNum"></span></div>
</div>

<script>
/* 킬내기 방송 오버레이 v2 — 점수판과 같은 서버 값(/api/killrace/board)을 5초마다, 개인 기록(/api/killrace/players)을 10초마다 받는다.
 * 팀 줄 = 순위 · 팀명(판 수 · 치킨은 작게) · 킬 · 딜 · 점수(가장 크게). 점수 · 킬 · 딜은 전부 서버가 센 확정 값이다.
 * 회색 「잠정 +n」 = 팀이 누른 잠정 킬 · 「스샷 +n」 = 결과 사진에서 읽은 잠정 킬(둘 다 총점에 안 들어간다).
 * MVP = 이번 대회 누적 「킬 + 딜/100」 이 가장 높은 한 명(같으면 킬 · 딜 순). 기록이 없으면 띠를 숨긴다.
 * v1(killnaegi-overlay.html)은 그대로 둔다 — 주소만 바꾸면 OBS 에서 바로 바꿔 쓸 수 있다. 계좌 · 디스코드 닉은 응답에 아예 없다. */
(function(){
  "use strict";
  var LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  var GAPI = LOCAL ? location.origin : "https://mri-academy-production.up.railway.app";
  var q = new URLSearchParams(location.search);
  var scale = Math.min(3, Math.max(0.5, Number(q.get("scale")) || 1));
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); };
  var hm = function(ms){ var d = new Date(ms + 9 * 3600000); return ("0" + d.getUTCHours()).slice(-2) + ":" + ("0" + d.getUTCMinutes()).slice(-2); };
  var mins = function(ms){ return Math.max(0, Math.ceil(ms / 60000)); };
  var n = function(v){ return (Number(v) || 0).toLocaleString("ko-KR"); };
  var B = null, skew = 0, seenGain = null, queue = [], showing = false;
  $("board").style.transform = "scale(" + scale + ")";

  // 판 순번 버닝(서버 boostMode "seq" · boostSeqs 예 [5, 7]) — 시각 회차 응답에는 이 칸이 없거나 "time" 이다
  function seqBoost(){ return !!(B && B.boostMode === "seq" && B.boostSeqs && B.boostSeqs.length); }
  // 그 팀의 다음 인정 판이 버닝 판이면(서버 teams[].nextBoost) 대회 중에만 작은 표를 붙인다
  function nextBoost(x, t){ return seqBoost() && x.nextBoost === true && t < B.event.end ? '<span class="nb">다음 판 ' + B.boostMul + "배</span>" : ""; }

  function render(){
    if (!B) return;
    var rm = /(\d+)\s*회/.exec(B.event.name || "");                 // 회차 글자는 서버 대회 이름에서
    $("evRound").textContent = rm ? rm[1] + "회" : (B.eventId ? B.eventId + "회" : "");
    $("board").hidden = false;
    var t = Date.now() + skew;
    $("clock").innerHTML = t < B.event.start ? "시작까지 <b>" + mins(B.event.start - t) + "분</b>"
      : t < B.event.end ? "끝까지 <b>" + mins(B.event.end - t) + "분</b>" : "<b>" + hm(B.event.end) + "</b> 마감";
    var showMove = B.rankChangedAt && t - B.rankChangedAt < 3 * 60000;
    $("rows").innerHTML = B.teams.map(function(x){
      var move = showMove && x.prevRank && x.prevRank !== x.rank
        ? '<span class="move ' + (x.prevRank > x.rank ? "up" : "down") + '">' + (x.prevRank > x.rank ? "▲" : "▼") + Math.abs(x.prevRank - x.rank) + "</span>" : "";
      var prov = [];
      if (x.provisional) prov.push("잠정 +" + x.provisional);
      if (x.shot) prov.push("스샷 +" + x.shot.kills);
      return '<div class="row' + (x.rank === 1 ? " first" : "") + '"><div class="rk">' + x.rank + "</div>" +
        '<div class="who"><div class="name">' + esc(x.name) + move + '</div><div class="meta">' + nextBoost(x, t) + x.games + "판 · 치킨 " + x.chickens +
          prov.map(function(p){ return '<span class="pv">' + p + "</span>"; }).join("") + "</div></div>" +
        '<div class="num k">' + x.kills + "</div>" +
        '<div class="num d">' + n(x.damage) + "</div>" +
        '<div class="num pts">' + x.total + "</div></div>";
    }).join("");
    var last = B.run && B.run.ok && B.run.at ? B.run.at : B.updatedAt ? Date.parse(B.updatedAt) : null;
    // 버닝 안내 — 판 순번 회차(5회부터 · 서버 boostMode "seq")는 「5 · 7번째 판 1.5배」, 시각 회차(2 · 3 · 4회)는 종전 그대로
    $("footL").innerHTML = seqBoost() ? (t < B.event.end ? "<b>" + B.boostSeqs.join(" · ") + "번째 판 " + B.boostMul + "배</b>" : "회색 숫자는 잠정 킬")
      : B.boostAt == null || t >= B.event.end ? "회색 숫자는 잠정 킬"
      : t < B.boostAt ? "1.5배 판까지 <b>" + mins(B.boostAt - t) + "분</b>" : "<b>지금 시작하는 판 " + B.boostMul + "배</b>";
    $("footR").textContent = last ? hm(last) + " 갱신" : "집계 전";
  }

  // MVP — 개인 기록(확정 판)에서 「킬 + 딜/100」 이 가장 높은 한 명. 기록이 하나도 없으면 띠를 숨긴다
  function renderMvp(P){
    var all = [];
    ((P && P.teams) || []).forEach(function(t){
      (t.players || []).forEach(function(p){ if ((p.kills || 0) > 0 || (p.damage || 0) > 0) all.push({ team: t.name, ign: p.ign, kills: p.kills || 0, damage: p.damage || 0 }); });
    });
    if (!all.length) { $("mvp").hidden = true; return; }
    all.sort(function(a, b){
      return (b.kills + b.damage / 100) - (a.kills + a.damage / 100) || b.kills - a.kills || b.damage - a.damage || String(a.ign).localeCompare(String(b.ign));
    });
    var m = all[0];
    $("mvpIgn").textContent = m.ign;
    $("mvpLine").innerHTML = "<small>·</small>" + m.kills + "킬<small>·</small>딜 " + n(m.damage);
    $("mvpTeam").textContent = m.team;
    $("mvp").hidden = false;
  }

  function nextToast(){
    if (showing || !queue.length) return;
    var g = queue.shift(), el = $("toast");
    showing = true;
    $("toastName").textContent = g.team;
    $("toastNum").textContent = (g.delta > 0 ? "+" : "−") + Math.abs(g.delta);
    el.className = "toast show" + (g.delta < 0 ? " down" : "");
    setTimeout(function(){ el.className = "toast" + (g.delta < 0 ? " down" : ""); setTimeout(function(){ showing = false; nextToast(); }, 400); }, 6000);
  }

  function load(){
    fetch(GAPI + "/api/killrace/board", { cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j) return;
        B = j; skew = j.serverNow - Date.now();
        // 처음 열었을 때는 지난 득점을 다시 띄우지 않는다
        if (seenGain === null) seenGain = (j.gains || []).reduce(function(m, g){ return Math.max(m, g.at); }, 0);
        (j.gains || []).filter(function(g){ return g.at > seenGain; }).forEach(function(g){ queue.push(g); seenGain = Math.max(seenGain, g.at); });
        render(); nextToast();
      })
      .catch(function(){});
  }
  function loadPlayers(){
    fetch(GAPI + "/api/killrace/players", { cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if (j) renderMvp(j); })
      .catch(function(){});
  }
  load(); loadPlayers();
  setInterval(load, 5000);
  setInterval(loadPlayers, 10000);
  setInterval(render, 15000);
})();
</script>
</body>
</html>
