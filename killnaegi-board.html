<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대승배 GmI 킬내기 2회 | 점수판</title>
<meta name="description" content="대승배 GmI 킬내기 2회 점수판. 22:20부터 순위는 비공개, 23:00에 최종 발표.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F6F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 킬내기 전용 라이트 테마 — killnaegi.html 과 같은 토큰 */
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --field:#F0F2F5; --line:#E3E6EB;
  --ink:#172033; --ink-dim:#4E5869; --ink-faint:#6B7484;
  --accent:#2F6FEB; --accent-soft:#EAF1FF; --accent-ink:#1D4FB8;
  --red:#D93A2B; --red-soft:#FDECEA; --green:#1E8E5A;
  --cream:#FFF4E0; --cream-line:#F1E3C4; --sun:#F59E0B;
  --display:'Saira Condensed','Pretendard Variable',sans-serif;
  --body:'Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif;
  --r-lg:20px; --r-md:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input{font-family:inherit;font-size:inherit;color:inherit;}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px 32px;}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;}
.top{background:var(--cream);border-bottom:1px solid var(--cream-line);padding:12px 0;}
.top-in{max-width:1500px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,40px);line-height:1.05;}
.top h1 span{color:var(--sun);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:#fff;border:1px solid var(--cream-line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-dim);}
.chip b{color:var(--ink);}
.chip.me{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink);font-weight:700;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:14px;}
.card-h{font-size:17px;font-weight:800;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.card-h small{font-size:13px;font-weight:500;color:var(--ink-faint);}
.muted{color:var(--ink-faint);font-size:14px;}
.scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:15px;}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
th{font-size:12.5px;color:var(--ink-faint);font-weight:600;}
td.r,th.r{text-align:right;}
td.total{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;}
tr.first td{background:var(--cream);}
.rk{font-family:var(--display);font-weight:800;font-size:22px;width:36px;}
.minus{color:var(--red);}
.plus{color:var(--green);}
.tag{border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;background:var(--field);color:var(--ink-dim);}
.tag.boost{background:var(--accent-soft);color:var(--accent-ink);}
.tag.leave{background:var(--red-soft);color:var(--red);}
.hidden-box{text-align:center;padding:36px 8px;}
.hidden-box b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,64px);line-height:1.05;margin-bottom:8px;}
.names{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--field);color:var(--ink);min-height:44px;}
.btn.main{background:var(--accent);color:#fff;}
.btn:focus-visible,.input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.input{background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-height:44px;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-dim);margin:10px 0 5px;}
.msg{min-height:20px;font-size:14px;color:var(--red);margin-top:8px;}
.msg.ok{color:var(--green);}
[hidden]{display:none !important;}
@media (min-width:1100px){ table{font-size:18px;} td.total{font-size:38px;} .rk{font-size:30px;} .card{padding:24px;} }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1>킬내기 <span>2회</span> 점수판</h1>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap">
  <section class="card" id="hostGate" hidden style="max-width:520px;">
    <h2 class="card-h">진행자 확인</h2>
    <label class="label" for="hostKey">운영 키</label>
    <div class="row">
      <input class="input" id="hostKey" type="password" autocomplete="off" style="flex:1 1 160px;">
      <button type="button" class="btn main" data-act="hostLogin">들어가기</button>
    </div>
    <p class="msg" id="hostGateMsg" role="status" aria-live="polite"></p>
  </section>

  <section class="card" id="standings" aria-live="polite"></section>

  <!-- 진행자: 발표 전 판별 점수 확인 -->
  <section class="card" id="review" hidden>
    <h2 class="card-h">판별 점수<small>발표 전에 한 줄씩 확인해요. 점수는 마지막으로 /킬내기집계 를 돌린 시점 기준이에요</small></h2>
    <div class="scroll" id="reviewTable"></div>
  </section>

  <section class="card" id="hostCard" hidden>
    <h2 class="card-h">진행자</h2>
    <p class="muted" id="hostState"></p>
    <div class="row" style="margin-top:10px;">
      <button type="button" class="btn main" data-act="publish">최종 결과 발표하기</button>
      <button type="button" class="btn" data-act="unpublish">발표 취소</button>
    </div>
    <label class="label" for="hideAt">순위 비공개 시작</label>
    <div class="row"><input class="input" id="hideAt" type="datetime-local"></div>
    <label class="label" for="boostAt">1.5배 판 시작 시각</label>
    <div class="row">
      <input class="input" id="boostAt" type="datetime-local">
      <button type="button" class="btn" data-act="times">시각 저장</button>
    </div>
    <p class="msg" id="hostMsg" role="status" aria-live="polite"></p>
  </section>
</main>

<script>
/* 킬내기 2회 점수판 — 점수 · 순위 · 비공개 판정은 서버(mri-academy killrace.cjs)가 한다.
 * 보는 사람: 22:20부터 발표 전까지 점수가 오지 않는다(서버가 아예 안 보낸다).
 * 진행자(?host=1 + 운영 키): 비공개 시간에도 전부 보이고 판별 점수 표가 붙는다. */
(function(){
  "use strict";
  var LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  var GAPI = LOCAL ? location.origin : "https://mri-academy-production.up.railway.app";
  var hostMode = new URLSearchParams(location.search).get("host") === "1";
  var store = { get: function(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
                set: function(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} } };
  var adminKey = hostMode ? store.get("kn_host") : null;
  var B = null, isHost = false;
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); };
  var hm = function(ms){ if (ms == null) return "–"; var d = new Date(ms + 9 * 3600000); return ("0" + d.getUTCHours()).slice(-2) + ":" + ("0" + d.getUTCMinutes()).slice(-2); };
  var signed = function(n){ return (n > 0 ? "+" : "") + n; };
  // datetime-local(한국 시간으로 적는다) ↔ ms
  var toLocal = function(ms){ if (ms == null) return ""; return new Date(ms + 9 * 3600000).toISOString().slice(0, 16); };
  var fromLocal = function(v){ return v ? new Date(v + ":00+09:00").toISOString() : null; };

  function load(){
    var h = adminKey ? { "x-admin-key": adminKey } : {};
    return fetch(GAPI + "/api/killrace/board", { headers: h, cache: "no-store" })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, body: j }; }); })
      .then(function(r){ B = r.ok ? r.body : { error: r.body && r.body.error }; isHost = !!B.admin; render(); })
      .catch(function(){});
  }

  function render(){
    $("hostGate").hidden = !(hostMode && !isHost);
    var el = $("standings");
    if (!B || B.error) { el.innerHTML = '<div class="hidden-box"><b>아직 열리지 않았어요</b><span class="muted">대회가 시작되면 여기에 순위가 보여요</span></div>'; $("chips").innerHTML = ""; return; }
    var chips = ['<span class="chip"><b>' + esc(B.event.name) + "</b></span>", '<span class="chip">' + hm(B.event.start) + " ~ " + hm(B.event.end) + "</span>"];
    if (B.boostAt != null) chips.push('<span class="chip">' + hm(B.boostAt) + " 이후 첫 판 <b>" + B.boostMul + "배</b></span>");
    if (isHost) chips.push('<span class="chip me">진행자</span>');
    $("chips").innerHTML = chips.join("");

    if (B.hidden) {
      el.innerHTML = '<div class="hidden-box"><b>순위는 지금 비공개예요</b><span class="muted">' + hm(B.hideAt) + "부터 가렸어요. 최종 결과는 " + hm(B.event.end) + ' 발표 때 공개해요</span>' +
        '<div class="names">' + B.teams.map(function(t){ return '<span class="chip">' + esc(t.name) + "</span>"; }).join("") + "</div></div>";
    } else {
      var note = B.updatedAt ? hm(Date.parse(B.updatedAt)) + " 집계 기준" : "아직 집계 전";
      if (isHost && B.hiddenForPublic) note += " · 보는 사람 화면은 비공개";
      el.innerHTML = '<h2 class="card-h">' + (B.published ? "최종 결과" : "지금 순위") + "<small>" + esc(note) + "</small></h2>" +
        '<div class="scroll"><table><thead><tr><th></th><th>팀</th><th class="r">총점</th><th class="r">판 점수</th><th class="r">보너스</th><th class="r">판</th><th class="r">치킨</th><th class="r">킬</th></tr></thead><tbody>' +
        B.teams.map(function(t){
          return '<tr class="' + (t.rank === 1 ? "first" : "") + '"><td class="rk">' + t.rank + "</td><td><b>" + esc(t.name) + '</b></td><td class="r total' + (t.total < 0 ? " minus" : "") + '">' + t.total +
            '</td><td class="r num">' + t.gameScore + '</td><td class="r num">' + (t.bonus ? signed(t.bonus) : "–") + '</td><td class="r num">' + t.games + '</td><td class="r num">' + t.chickens + '</td><td class="r num">' + t.kills + "</td></tr>";
        }).join("") + "</tbody></table></div>" +
        (B.hideAt != null && !B.published ? '<p class="muted" style="margin-top:10px;">' + hm(B.hideAt) + "부터는 순위를 가리고 " + hm(B.event.end) + "에 발표해요</p>" : "");
    }

    $("review").hidden = !isHost; $("hostCard").hidden = !isHost;
    if (!isHost) return;
    $("reviewTable").innerHTML = '<table><thead><tr><th>팀</th><th class="r">판</th><th>맵</th><th>시작</th><th class="r">순위</th><th class="r">킬</th><th class="r">딜</th><th class="r">딜 점수</th><th class="r">감점</th><th class="r">치킨</th><th>배수</th><th class="r">점수</th></tr></thead><tbody>' +
      B.teams.map(function(t){
        var rows = (t.rows || []).map(function(g){
          var mark = g.leave ? '<span class="tag leave">이탈 −10</span>' : g.boost ? '<span class="tag boost">' + g.base + " ×" + g.boost + "</span>" : "";
          var pen = g.penalty ? '<span class="minus">−' + g.penalty + "</span> (" + g.deadSlots.join("·") + "번)" : "0";
          return "<tr><td>" + esc(t.name) + '</td><td class="r num">' + g.seq + "</td><td>" + esc(g.map) + "</td><td>" + hm(g.startedAt) + '</td><td class="r num">' + (g.place || "–") + '</td><td class="r num">' + g.kills +
            '</td><td class="r num">' + g.damage + '</td><td class="r num">+' + g.dmgPts + '</td><td class="r">' + pen + '</td><td class="r num">' + (g.chicken ? "+" + g.chicken : "–") + "</td><td>" + mark + '</td><td class="r num"><b>' + g.score + "</b></td></tr>";
        }).join("");
        var foot = "<tr><td><b>" + esc(t.name) + '</b></td><td colspan="10" class="muted">판 합계 ' + t.gameScore + (t.bonus ? " · 남은 포인트 보너스 " + signed(t.bonus) : "") + '</td><td class="r num"><b>' + t.total + "</b></td></tr>";
        return (rows || "<tr><td>" + esc(t.name) + '</td><td colspan="11" class="muted">인정된 판이 아직 없어요</td></tr>') + foot;
      }).join("") + "</tbody></table>";
    $("hostState").textContent = B.published ? "발표했어요. 보는 사람 화면에 순위가 보여요" : B.hiddenForPublic ? "지금 보는 사람 화면은 비공개예요" : "지금 보는 사람 화면에 순위가 보여요";
    if (document.activeElement !== $("hideAt")) $("hideAt").value = toLocal(B.hideAt);
    if (document.activeElement !== $("boostAt")) $("boostAt").value = toLocal(B.boostAt);
  }

  function admin(body){
    return fetch(GAPI + "/api/killrace/board/admin", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": adminKey }, body: JSON.stringify(body) })
      .then(function(r){ var m = $("hostMsg"); m.className = "msg" + (r.ok ? " ok" : ""); m.textContent = r.ok ? "저장했어요" : "저장하지 못했어요. 다시 해볼까요?"; return load(); });
  }
  document.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "hostLogin") {
      adminKey = $("hostKey").value.trim(); if (!adminKey) return;
      load().then(function(){ if (isHost) store.set("kn_host", adminKey); else { adminKey = null; $("hostGateMsg").textContent = "운영 키가 맞지 않아요"; } });
      return;
    }
    if (act === "publish") { if (confirm("최종 결과를 공개할까요? 보는 사람 화면에 순위가 바로 보여요")) admin({ action: "publish" }); return; }
    if (act === "unpublish") { admin({ action: "unpublish" }); return; }
    if (act === "times") { admin({ action: "times", hideAt: fromLocal($("hideAt").value), boostAt: fromLocal($("boostAt").value) }); return; }
  });

  load();
  setInterval(load, 10000);
})();
</script>
</body>
</html>
