<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대승배 GmI 킬내기 2회 | 점수판</title>
<meta name="description" content="대승배 GmI 킬내기 2회 점수판. 판이 끝나면 자동으로 올라가고 끝까지 공개해요.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F6F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 킬내기 전용 라이트 테마 — killnaegi.html 과 같은 토큰. 폰 360 을 먼저 맞추고 넓은 화면은 가운데로 모은다 */
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --field:#F0F2F5; --line:#E3E6EB;
  --ink:#172033; --ink-dim:#4E5869; --ink-faint:#6B7484;
  --accent:#2F6FEB; --accent-soft:#EAF1FF; --accent-ink:#1D4FB8;
  --red:#D93A2B; --red-soft:#FDECEA; --green:#1E8E5A; --green-soft:#E6F4EC;
  --cream:#FFF4E0; --cream-line:#F1E3C4; --sun:#F59E0B;
  --display:'Saira Condensed','Pretendard Variable',sans-serif;
  --body:'Pretendard Variable',-apple-system,BlinkMacSystemFont,sans-serif;
  --r-lg:20px; --r-md:14px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input{font-family:inherit;font-size:inherit;color:inherit;}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 32px;}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;}
.top{background:var(--cream);border-bottom:1px solid var(--cream-line);padding:12px 0;}
.top-in{max-width:760px;margin:0 auto;padding:0 12px;}
.top h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,7vw,38px);line-height:1.05;margin-bottom:8px;}
.top h1 span{color:var(--sun);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{background:#fff;border:1px solid var(--cream-line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-dim);}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums;}
.chip.hot{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink);font-weight:700;}
.chip.warn{background:var(--red-soft);border-color:var(--red-soft);color:var(--red);font-weight:700;}
.empty{text-align:center;padding:40px 8px;color:var(--ink-faint);}
.empty b{display:block;font-size:20px;color:var(--ink);margin-bottom:4px;}

.team{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);margin-top:10px;overflow:hidden;}
.team.first{border-color:var(--sun);}
.team-h{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer;min-height:64px;}
.team-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.rk{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-align:center;}
.team.first .rk{color:var(--sun);}
.name{font-weight:800;font-size:17px;line-height:1.25;overflow-wrap:anywhere;}
.sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px;}
.move{font-size:12px;font-weight:800;margin-left:6px;}
.move.up{color:var(--green);} .move.down{color:var(--red);}
.score{text-align:right;line-height:1;}
.total{font-family:var(--display);font-weight:800;font-size:38px;font-variant-numeric:tabular-nums;}
.total.minus{color:var(--red);}
.prov{display:block;font-size:12.5px;font-weight:700;color:var(--ink-faint);margin-top:3px;}
.detail{border-top:1px solid var(--line);padding:12px 14px 14px;}
.chase{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r-md);padding:10px 12px;font-size:14.5px;font-weight:700;}
.chase small{display:block;font-size:12.5px;font-weight:500;color:var(--ink-dim);margin-top:2px;}
.members{font-size:12.5px;color:var(--ink-faint);margin:10px 0 4px;overflow-wrap:anywhere;}
.game{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
.game:first-of-type{border-top:0;}
.game-h{font-weight:700;}
.game-h span{font-weight:500;color:var(--ink-faint);}
.game-s{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;text-align:right;grid-row:span 2;align-self:center;}
.game-s.minus{color:var(--red);}
.game-d{color:var(--ink-dim);}
.game.void .game-h,.game.void .game-d{color:var(--ink-faint);}
.minus{color:var(--red);}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;background:var(--field);color:var(--ink-dim);}
.tag.boost{background:var(--accent-soft);color:var(--accent-ink);}
.tag.leave{background:var(--red-soft);color:var(--red);}
.tag.ok{background:var(--green-soft);color:var(--green);}
.host-row{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:36px;}
.mini.on{background:var(--red-soft);border-color:var(--red-soft);color:var(--red);}
.mini:focus-visible,.btn:focus-visible,.input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:14px;}
.card-h{font-size:17px;font-weight:800;margin-bottom:8px;}
.muted{color:var(--ink-faint);font-size:13.5px;}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--field);color:var(--ink);min-height:44px;}
.btn.main{background:var(--accent);color:#fff;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.input{background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;min-height:44px;min-width:0;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-dim);margin:12px 0 5px;}
.msg{min-height:20px;font-size:14px;color:var(--red);margin-top:8px;}
.msg.ok{color:var(--green);}
.state{border-radius:var(--r-md);padding:10px 12px;font-size:14px;font-weight:700;background:var(--green-soft);color:var(--green);}
.state.bad{background:var(--red-soft);color:var(--red);}
.state.idle{background:var(--field);color:var(--ink-dim);}
.links{list-style:none;margin-top:8px;}
.links li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px;}
.foot{text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:16px;}
.foot a{color:var(--ink-dim);}
[hidden]{display:none !important;}
@media (prefers-reduced-motion:no-preference){ .total{transition:color .3s ease-out;} }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <h1>킬내기 <span>2회</span> 점수판</h1>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap">
  <section class="card" id="hostGate" hidden>
    <h2 class="card-h">진행자 확인</h2>
    <label class="label" for="hostKey">운영 키</label>
    <div class="row">
      <input class="input" id="hostKey" type="password" autocomplete="off" style="flex:1 1 160px;">
      <button type="button" class="btn main" data-act="hostLogin">들어가기</button>
    </div>
    <p class="msg" id="hostGateMsg" role="status" aria-live="polite"></p>
  </section>

  <section class="card" id="hostCard" hidden>
    <h2 class="card-h">진행자</h2>
    <div class="state idle" id="runState"></div>
    <div class="row" style="margin-top:10px;">
      <button type="button" class="btn main" data-act="run" id="runBtn">지금 집계</button>
      <button type="button" class="btn" data-act="auto" id="autoBtn"></button>
    </div>
    <label class="label" for="boostAt">1.5배 판 시작 시각</label>
    <div class="row">
      <input class="input" id="boostAt" type="datetime-local" style="flex:1 1 180px;">
      <button type="button" class="btn" data-act="boostAt">저장</button>
    </div>
    <label class="label">팀별 +1킬 주소</label>
    <p class="muted">팀마다 주소가 달라요. 팀장에게 DM 으로 하나씩 보내 주세요</p>
    <ul class="links" id="links"></ul>
    <div class="row" style="margin-top:8px;"><button type="button" class="btn" data-act="tokens">주소 만들기</button></div>
    <p class="msg" id="hostMsg" role="status" aria-live="polite"></p>
    <div id="excluded"></div>
  </section>

  <div id="standings" aria-live="polite"></div>
  <p class="foot"><a href="killnaegi.html">룰 보기</a></p>
</main>

<script>
/* 킬내기 2회 점수판 — 점수 · 순위 · 역전까지 몇 점인지는 전부 서버(mri-academy killrace.cjs · killrace-live.cjs)가 계산한다.
 * 이 화면은 받은 값을 그리기만 한다. 5초마다 다시 받는다. 끝까지 공개한다(가리는 시간 없음 — 지휘 10/4 개정).
 * 회색 「잠정 +n」 은 팀이 +1킬 버튼으로 누른 값이다. 총점에는 들어가지 않고 그 판이 확정되면 0 으로 돌아간다.
 * 진행자(?host=1 + 운영 키): 「지금 집계」 · 자동 집계 켜고 끄기 · 이탈 −10 · 이 판 무효(낙하 전 튕김) · 핵 사망 무효 · 팀별 +1킬 주소. */
(function(){
  "use strict";
  var LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  var GAPI = LOCAL ? location.origin : "https://mri-academy-production.up.railway.app";
  var hostMode = new URLSearchParams(location.search).get("host") === "1";
  var store = { get: function(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
                set: function(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} } };
  var adminKey = hostMode ? store.get("kn_host") : null;
  var B = null, isHost = false, skew = 0, open = {}, busy = false;
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); };
  var hm = function(ms){ if (ms == null) return "–"; var d = new Date(ms + 9 * 3600000); return ("0" + d.getUTCHours()).slice(-2) + ":" + ("0" + d.getUTCMinutes()).slice(-2); };
  var signed = function(n){ return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n); };
  var mins = function(ms){ return Math.max(0, Math.ceil(ms / 60000)); };
  var toLocal = function(ms){ if (ms == null) return ""; return new Date(ms + 9 * 3600000).toISOString().slice(0, 16); };
  var fromLocal = function(v){ return v ? new Date(v + ":00+09:00").toISOString() : null; };
  var now = function(){ return Date.now() + skew; };

  function load(){
    var h = adminKey ? { "x-admin-key": adminKey } : {};
    return fetch(GAPI + "/api/killrace/board", { headers: h, cache: "no-store" })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, body: j }; }); })
      .then(function(r){
        B = r.ok ? r.body : { error: true };
        if (r.ok) { isHost = !!B.admin; skew = B.serverNow - Date.now(); }
        render();
      })
      .catch(function(){ if (B && !B.error) { B.stale = true; renderChips(); } });
  }

  function renderChips(){
    if (!B || B.error) { $("chips").innerHTML = ""; return; }
    var t = now(), chips = [];
    if (t < B.event.start) chips.push('<span class="chip">시작까지 <b>' + mins(B.event.start - t) + "분</b></span>");
    else if (t < B.event.end) chips.push('<span class="chip">끝까지 <b>' + mins(B.event.end - t) + "분</b></span>");
    else chips.push('<span class="chip"><b>' + hm(B.event.end) + "</b> 마감 · 돌던 판까지 집계해요</span>");
    if (B.boostAt != null && t < B.event.end) {
      chips.push(t < B.boostAt ? '<span class="chip">1.5배 판까지 <b>' + mins(B.boostAt - t) + "분</b></span>"
        : '<span class="chip hot">지금 시작하는 판은 ' + B.boostMul + "배</span>");
    }
    var last = B.run && B.run.ok && B.run.at ? B.run.at : B.updatedAt ? Date.parse(B.updatedAt) : null;
    chips.push(B.stale ? '<span class="chip warn">연결이 끊겼어요. 다시 받는 중</span>'
      : '<span class="chip">' + (last ? "<b>" + hm(last) + "</b> 갱신" : "아직 집계 전") + "</span>");
    if (isHost) chips.push('<span class="chip hot">진행자</span>');
    $("chips").innerHTML = chips.join("");
  }

  function chaseLine(t){
    var c = t.chase;
    if (!c) return "";
    if (c.lead != null) return '<div class="chase">1등이에요 · 2등과 ' + c.lead + "점 차" + (t.boostUsed || B.boostAt == null ? "" : "<small>1.5배 판이 아직 남아 있어요</small>") + "</div>";
    var how = c.afterChicken === 0 ? "치킨 한 번이면 역전" : "치킨 1번 + " + c.afterChicken + "킬이면 역전";
    var next = c.toNext !== c.toFirst ? " · 바로 위 " + esc(c.nextName) + "까지 " + c.toNext + "점" : "";
    return '<div class="chase">1등까지 ' + c.toFirst + "점 → " + how +
      "<small>딜 100도 1점이에요" + next + (t.boostUsed || B.boostAt == null ? "" : " · 1.5배 판이 남아 있어요") + "</small></div>";
  }

  function gameRow(t, g){
    if (g.void) {
      return '<div class="game void"><div class="game-h">' + esc(g.map) + " <span>" + hm(g.startedAt) + '</span></div><div class="game-s">0</div>' +
        '<div class="game-d">' + (g.why === "drop" ? "튕겨서 낙하를 못 해 무효로 했어요" : t.members.length + "명이 아니라 인정되지 않았어요") + "</div>" +
        (isHost && g.why === "drop" ? '<div class="host-row"><button type="button" class="mini on" data-act="voidGame" data-team="' + esc(t.name) + '" data-mid="' + esc(g.matchId) + '" data-clear="1">무효 해제</button></div>' : "") + "</div>";
    }
    var parts = ["킬 " + g.kills, "딜 " + g.damage + " +" + g.dmgPts];
    if (g.chicken) parts.push("치킨 +" + g.chicken);
    if (g.penalty) parts.push('<span class="minus">사망 ' + g.deadSlots.join("·") + "번 −" + g.penalty + "</span>");
    if (g.voidSlots && g.voidSlots.length) parts.push(g.voidSlots.join("·") + "번 사망 무효");
    var tag = g.leave ? ' <span class="tag leave">이탈 −10</span>' : g.boost ? ' <span class="tag boost">' + g.base + " ×" + g.boost + "</span>" : "";
    var host = "";
    if (isHost) {
      var dead = (g.deadSlots || []).concat(g.voidSlots || []).sort();
      host = '<div class="host-row"><button type="button" class="mini' + (g.leave ? " on" : "") + '" data-act="leave" data-team="' + esc(t.name) + '" data-seq="' + g.seq + '" data-clear="' + (g.leave ? 1 : 0) + '">' + (g.leave ? "이탈 해제" : "이탈 −10") + "</button>" +
        dead.map(function(s){ var v = (g.voidSlots || []).indexOf(s) >= 0;
          return '<button type="button" class="mini' + (v ? " on" : "") + '" data-act="void" data-team="' + esc(t.name) + '" data-seq="' + g.seq + '" data-slot="' + s + '" data-clear="' + (v ? 1 : 0) + '">' + s + "번 " + (v ? "무효 해제" : "핵 사망 무효") + "</button>"; }).join("") +
        '<button type="button" class="mini" data-act="voidGame" data-team="' + esc(t.name) + '" data-mid="' + esc(g.matchId) + '" data-seq="' + g.seq + '" data-clear="0">이 판 무효</button></div>' +
        (g.logout && g.logout.length && !g.leave ? '<div class="host-row"><span class="tag leave">' + g.logout.join("·") + "번이 살아 있는 채로 나갔어요 · 이탈인지 확인해 주세요</span></div>" : "");
    }
    return '<div class="game"><div class="game-h">' + g.seq + "판 " + esc(g.map) + " <span>" + hm(g.startedAt) + (g.place ? " · " + g.place + "위" : "") + "</span>" + tag + '</div>' +
      '<div class="game-s' + (g.score < 0 ? " minus" : "") + '">' + signed(g.score) + '</div><div class="game-d">' + parts.join(" · ") + "</div>" + host + "</div>";
  }

  function render(){
    $("hostGate").hidden = !(hostMode && !isHost);
    $("hostCard").hidden = !isHost;
    renderChips();
    var el = $("standings");
    if (!B || B.error) { el.innerHTML = '<div class="empty"><b>아직 열리지 않았어요</b>대회가 시작되면 여기에 순위가 보여요</div>'; return; }
    if (!B.teams.length) { el.innerHTML = '<div class="empty"><b>팀이 아직 없어요</b>20:30 경매가 끝나면 팀이 올라와요</div>'; }
    else {
      var showMove = B.rankChangedAt && now() - B.rankChangedAt < 10 * 60000;
      el.innerHTML = B.teams.map(function(t){
        var isOpen = !!open[t.name];
        var move = showMove && t.prevRank && t.prevRank !== t.rank
          ? '<span class="move ' + (t.prevRank > t.rank ? "up" : "down") + '">' + (t.prevRank > t.rank ? "▲" : "▼") + Math.abs(t.prevRank - t.rank) + "</span>" : "";
        var sub = t.games + "판 · 킬 " + t.kills + " · 치킨 " + t.chickens + (t.bonus ? " · 보너스 " + signed(t.bonus) : "");
        var rows = t.rows.length ? t.rows.map(function(g){ return gameRow(t, g); }).join("") : '<p class="muted" style="padding:8px 0;">끝난 판이 아직 없어요</p>';
        return '<article class="team' + (t.rank === 1 ? " first" : "") + '">' +
          '<button type="button" class="team-h" data-act="toggle" data-team="' + esc(t.name) + '" aria-expanded="' + isOpen + '">' +
            '<span class="rk">' + t.rank + '</span>' +
            '<span><span class="name">' + esc(t.name) + move + '</span><span class="sub" style="display:block;">' + sub + "</span></span>" +
            '<span class="score"><span class="total' + (t.total < 0 ? " minus" : "") + '">' + t.total + "</span>" +
              (t.provisional ? '<span class="prov">잠정 +' + t.provisional + "킬</span>" : "") + "</span>" +
          "</button>" +
          (isOpen ? '<div class="detail">' + chaseLine(t) +
            '<p class="members">' + t.members.map(function(m){ return m.slot + "번 " + esc(m.ign); }).join(" · ") + "</p>" + rows + "</div>" : "") +
          "</article>";
      }).join("");
    }
    if (isHost) renderHost();
  }

  function renderHost(){
    var r = B.run || {}, st = $("runState");
    var txt, cls = "state";
    if (B.running) { txt = "집계 중이에요"; cls += " idle"; }
    else if (r.paused) { txt = "자동 집계가 멈췄어요 · 3번 연속 실패 (" + (r.error || "") + ") · 「지금 집계」 가 성공하면 다시 돌아요"; cls += " bad"; }
    else if (r.ok === false) { txt = hm(r.at) + " 집계 실패 (" + (r.error || "") + ") · 다시 돌리려면 「지금 집계」"; cls += " bad"; }
    else if (!B.auto) { txt = "자동 집계가 꺼져 있어요" + (r.at ? " · 마지막 " + hm(r.at) : ""); cls += " idle"; }
    else if (r.ok) { txt = hm(r.at) + " 집계 완료 · " + (r.games || 0) + "판 · 1분마다 자동으로 돌아요"; }
    else { txt = "아직 집계 전이에요 · 대회 시간에 1분마다 자동으로 돌아요"; cls += " idle"; }
    st.className = cls; st.textContent = txt;
    $("runBtn").disabled = busy || !!B.running;
    $("autoBtn").textContent = B.auto ? "자동 집계 끄기" : "자동 집계 켜기";
    if (document.activeElement !== $("boostAt")) $("boostAt").value = toLocal(B.boostAt);
    var base = location.origin + location.pathname.replace(/[^/]*$/, "") + "killnaegi-kill.html#t=";
    var withToken = B.teams.filter(function(t){ return t.liveToken; });
    $("links").innerHTML = withToken.length ? withToken.map(function(t){
      return "<li><span>" + esc(t.name) + '</span><button type="button" class="mini" data-act="copy" data-link="' + esc(base + t.liveToken) + '">주소 복사</button></li>';
    }).join("") : '<li class="muted">아직 없어요. 팀 등록이 끝난 뒤에 만들어 주세요</li>';
    var ex = [];
    B.teams.forEach(function(t){ (t.excluded || []).forEach(function(g){ ex.push(esc(t.name) + " · " + hm(g.startedAt) + " " + esc(g.map) + " · " + esc(g.reason)); }); });
    $("excluded").innerHTML = ex.length ? '<label class="label">점수에서 빠진 판</label><p class="muted">' + ex.join("<br>") + "</p>" : "";
  }

  function admin(body, okText){
    var m = $("hostMsg");
    return fetch(GAPI + "/api/killrace/board/admin", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": adminKey }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, body: j }; }); })
      .then(function(r){
        m.className = "msg" + (r.ok ? " ok" : "");
        var e = r.body && r.body.error;
        m.textContent = r.ok ? okText : e && e.code === "busy" ? "지금 집계가 돌고 있어요. 끝나면 다시 눌러 주세요"
          : e && e.message ? e.message : "안 됐어요. 한 번 더 눌러 주세요";
        return load();
      })
      .catch(function(){ m.className = "msg"; m.textContent = "서버에 닿지 않았어요. 한 번 더 눌러 주세요"; });
  }

  document.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]"); if (!b) return;
    var act = b.getAttribute("data-act"), d = b.dataset;
    if (act === "toggle") { open[d.team] = !open[d.team]; render(); return; }
    if (act === "hostLogin") {
      adminKey = $("hostKey").value.trim(); if (!adminKey) return;
      load().then(function(){ if (isHost) store.set("kn_host", adminKey); else { adminKey = null; $("hostGateMsg").textContent = "운영 키가 맞지 않아요"; } });
      return;
    }
    if (act === "run") { busy = true; $("runBtn").disabled = true; $("hostMsg").className = "msg ok"; $("hostMsg").textContent = "집계 중이에요";
      admin({ action: "run" }, "집계했어요").then(function(){ busy = false; render(); }); return; }
    if (act === "auto") { admin({ action: "auto", on: !B.auto }, B.auto ? "자동 집계를 껐어요" : "자동 집계를 켰어요"); return; }
    if (act === "boostAt") { admin({ action: "boostAt", boostAt: fromLocal($("boostAt").value) }, "저장했어요"); return; }
    if (act === "tokens") { admin({ action: "tokens" }, "주소를 만들었어요"); return; }
    if (act === "leave") {
      if (d.clear !== "1" && !confirm(d.team + " " + d.seq + "판을 이탈 −10 으로 바꿀까요?")) return;
      admin({ action: "leave", team: d.team, seq: Number(d.seq), clear: d.clear === "1" }, "바꿨어요"); return;
    }
    if (act === "void") {
      if (d.clear !== "1" && !confirm(d.team + " " + d.seq + "판 " + d.slot + "번 사망을 무효로 할까요? 리플레이로 확인한 것만 해 주세요")) return;
      admin({ action: "voidDeath", team: d.team, seq: Number(d.seq), slot: Number(d.slot), clear: d.clear === "1" }, "바꿨어요"); return;
    }
    if (act === "voidGame") {
      if (d.clear !== "1" && !confirm(d.team + " " + d.seq + "판을 무효로 할까요? 튕겨서 낙하를 못 한 사람이 있던 판만 해 주세요")) return;
      admin({ action: "voidGame", team: d.team, matchId: d.mid, clear: d.clear === "1" }, d.clear === "1" ? "되살렸어요" : "무효로 했어요"); return;
    }
    if (act === "copy") {
      var done = function(){ b.textContent = "복사했어요"; setTimeout(function(){ b.textContent = "주소 복사"; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(d.link).then(done, function(){ prompt("주소를 복사해 주세요", d.link); });
      else prompt("주소를 복사해 주세요", d.link);
    }
  });

  load();
  setInterval(load, 5000);
  setInterval(renderChips, 15000);
})();
</script>
</body>
</html>
