<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>G드컵 운영진 · 입금 확정</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root{--bg:#0a0a0c;--bg-card:#1a1a20;--bg-elev:#20202a;--ink:#f4f4f5;--ink-dim:#a1a1aa;--ink-faint:#71717a;--gold:#f5c518;--green:#10b981;--blue:#5ac8fa;--red:#e63946;--line:#27272a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",sans-serif;padding:18px;max-width:720px;margin:0 auto;}
h1{font-size:20px;margin-bottom:4px;}
.sub{color:var(--ink-dim);font-size:13px;margin-bottom:18px;}
.keybar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.keybar input{flex:1;min-width:160px;background:var(--bg-card);border:1px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:8px;font-size:14px;}
.btn{border:none;border-radius:8px;padding:11px 14px;font-weight:700;font-size:13px;cursor:pointer;}
.btn-gold{background:var(--gold);color:#000;}
.btn-ghost{background:var(--bg-card);color:var(--ink);border:1px solid var(--line);}
.stat{font-size:13px;color:var(--ink-dim);margin-bottom:12px;}
.stat b{color:var(--gold);font-size:16px;}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:10px;}
.card.confirmed{border-color:var(--green);}
.row1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.tname{font-size:16px;font-weight:800;}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.b-applied{background:rgba(161,161,170,.15);color:var(--ink-dim);}
.b-confirmed{background:rgba(16,185,129,.15);color:var(--green);}
.b-cancelled{background:rgba(230,57,70,.15);color:var(--red);}
.meta{color:var(--ink-dim);font-size:12.5px;margin:3px 0;}
.meta b{color:var(--ink);}
.contact{color:var(--blue);font-size:12.5px;margin:5px 0;}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap;}
.acts button{flex:1;min-width:90px;padding:9px;border-radius:7px;border:1px solid var(--line);background:var(--bg-elev);color:var(--ink);font-weight:700;font-size:12.5px;cursor:pointer;}
.acts .ok{border-color:var(--green);color:var(--green);}
.acts .wait{color:var(--ink-dim);}
.acts .del{border-color:var(--red);color:var(--red);}
.msg{padding:14px;text-align:center;color:var(--ink-dim);}
.warn{background:rgba(230,57,70,.1);border:1px solid var(--red);color:#fca5a5;padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:12px;}
</style>
</head>
<body>
<h1>🏆 G드컵 운영진 — 입금 확정</h1>
<p class="sub">입금 확인한 팀에 ✅확정을 누르면 사이트 명단·디스코드에 자동 반영됩니다. (운영진 전용)</p>

<div class="keybar">
  <input type="password" id="key" placeholder="운영진 키 입력 (GDCUP_ADMIN_KEY)">
  <button class="btn btn-gold" onclick="saveKeyAndLoad()">불러오기</button>
</div>
<div id="warn"></div>
<button class="btn btn-ghost" style="width:100%;margin-bottom:14px;" onclick="postBoard()">📋 디코에 '현재 모집현황' 게시</button>
<div class="stat" id="stat"></div>
<div id="list"><div class="msg">키를 입력하고 불러오기를 누르세요.</div></div>

<div style="margin:14px 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
  <label for="seasonSel" style="font-size:13px;opacity:.85;">시즌</label>
  <select id="seasonSel" onchange="onSeasonChange()" style="padding:7px 10px;border-radius:7px;"></select>
  <span id="seasonHint" style="font-size:12px;opacity:.6;"></span>
</div>

<h2 style="font-size:16px;margin:22px 0 8px;">🙋 솔로 / 용병 대기</h2>
<div id="soloAdminList"></div>

<script>
var GAPI="https://mri-academy-production.up.railway.app";
// 시즌 목록·기본값은 서버(/api/gdcup-meta)에서 받는다. 여기에 하드코딩하면
// 시즌이 늘 때마다 프론트를 고쳐야 하고, 서버와 어긋나면 조회 시즌이 틀어진다.
var SEASON=null;
function seasonQS(){ return SEASON!=null ? ("?season="+SEASON) : ""; }
function onSeasonChange(){
  var sel=document.getElementById('seasonSel');
  SEASON=parseInt(sel.value,10);
  try{ sessionStorage.setItem('gdcupSeason',String(SEASON)); }catch(e){}
  if(getKey())loadAdmin();
}
function loadSeasons(){
  return fetch(GAPI+"/api/gdcup-meta").then(function(r){return r.json();}).then(function(m){
    var sel=document.getElementById('seasonSel');
    var list=(m&&m.seasons&&m.seasons.length)?m.seasons:[m&&m.currentSeason].filter(Boolean);
    var saved=null; try{ saved=parseInt(sessionStorage.getItem('gdcupSeason'),10); }catch(e){}
    SEASON=(saved&&list.indexOf(saved)>=0)?saved:(m&&m.currentSeason)||list[list.length-1];
    sel.innerHTML=list.map(function(s){
      return '<option value="'+s+'"'+(s===SEASON?' selected':'')+'>시즌 '+s+(s===m.currentSeason?' (현재)':'')+'</option>';
    }).join('');
    document.getElementById('seasonHint').textContent=(SEASON===m.currentSeason)?'':'과거 시즌 조회 중';
  }).catch(function(){
    // meta 실패 시 시즌을 추측하지 않는다 — 서버 폴백(현재 시즌)에 맡긴다
    document.getElementById('seasonHint').textContent='시즌 목록을 못 불러왔어요 (현재 시즌으로 조회)';
  });
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function getKey(){return document.getElementById('key').value.trim();}
function saveKeyAndLoad(){var k=getKey(); if(k){try{sessionStorage.setItem('gdcupKey',k);}catch(e){}} loadAdmin();}

function loadAdmin(){
  var k=getKey(); var warn=document.getElementById('warn'); warn.innerHTML='';
  if(!k){warn.innerHTML='<div class="warn">키를 입력하세요.</div>';return;}
  document.getElementById('list').innerHTML='<div class="msg">불러오는 중…</div>';
  fetch(GAPI+"/api/gdcup-admin-list"+seasonQS(),{headers:{"x-admin-key":k}})
  .then(function(r){
    if(r.status===401){throw new Error('unauthorized');}
    return r.json();
  })
  .then(function(d){render((d&&d.teams)||[]);loadSolosAdmin();})
  .catch(function(e){
    document.getElementById('list').innerHTML='';
    if(String(e.message)==='unauthorized') warn.innerHTML='<div class="warn">❌ 키가 틀렸어요. Railway의 GDCUP_ADMIN_KEY 값과 똑같이 입력하세요.</div>';
    else warn.innerHTML='<div class="warn">불러오기 실패. 잠시 후 다시 시도하세요.</div>';
  });
}

function render(teams){
  var applied=0,confirmed=0;
  teams.forEach(function(t){ if(t.status==='confirmed')confirmed++; else if(t.status!=='cancelled')applied++; });
  document.getElementById('stat').innerHTML='✅ 확정 <b>'+confirmed+'</b> · ⏳ 신청 <b>'+applied+'</b> / 16팀';
  var el=document.getElementById('list');
  if(!teams.length){el.innerHTML='<div class="msg">아직 신청한 팀이 없어요.</div>';return;}
  function card(t){
    var st=t.status||'applied';
    // verified = 확정 시 서버 tier 재검증 통과. 강제확정은 확정이어도 미검증으로 남는다.
    var badge=st==='confirmed'
      ?(t.verified?'<span class="badge b-confirmed">✅ 확정 · 검증됨</span>'
                  :'<span class="badge b-confirmed" title="강제확정 — 서버 검증 생략됨">✅ 확정 · ⚠️ 미검증</span>')
      :(st==='cancelled'?'<span class="badge b-cancelled">🗑 취소</span>':'<span class="badge b-applied">⏳ 신청 · 미검증</span>');
    var memEdit=(t.members||[]).filter(function(m){return m.ign;}).map(function(m,mi){
      var opts=['T0','T1','T2','T3','T4','T5'].map(function(tt){return '<option value="'+tt+'"'+(m.tier===tt?' selected':'')+'>'+tt+'</option>';}).join('');
      // 닉은 인라인 편집 — 닉변·오타로 PUBG 조회가 실패하면 ⚠ 미검증이 뜨는데,
      // 여기서 못 고치면 SQL 말고는 방법이 없었다. 저장 시 서버가 재검증까지 돌린다.
      var inpStyle='background:var(--bg-elev);border:1px solid '+(m.registered===false?'#fbbf24':'var(--line)')
        +';color:var(--ink);padding:5px 8px;border-radius:6px;font-size:13px;min-width:0;flex:1;';
      return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;">'
        +'<span style="font-size:13px;flex:0 0 auto;">'+(mi===0?'👑':'&nbsp;&nbsp;')
        // registered===false 일 때만 표시 — 구 서버 응답(undefined)에서는 뱃지를 띄우지 않는다.
        +(m.registered===false?' <span title="등록계(clan_registry) 미등록 — 닉 오기재 가능성. 저장 시 서버가 PUBG 실존까지 재검증한다." style="color:#fbbf24;font-size:11px;font-weight:800;">⚠</span>':'')
        +'</span>'
        +'<input class="ign-edit" type="text" value="'+esc(m.ign||'')+'" maxlength="40" spellcheck="false" autocomplete="off"'
        +' data-team="'+t.id+'" data-idx="'+mi+'" title="인게임 닉 — 고친 뒤 💾 저장하면 서버가 재검증합니다" style="'+inpStyle+'">'
        +(m.peak?'<span style="color:var(--ink-faint);font-size:11px;flex:0 0 auto;">'+esc(m.peak)+'/'+esc(m.dmg||'?')+'딜</span>':'')
        +'<select class="tier-edit" data-team="'+t.id+'" data-idx="'+mi+'" data-name="'+esc(m.name||'')+'" data-peak="'+esc(m.peak||'')+'" data-dmg="'+esc(m.dmg||'')+'" style="background:var(--bg-elev);border:1px solid var(--line);color:var(--ink);padding:5px 8px;border-radius:6px;font-size:13px;flex:0 0 auto;">'+opts+'</select>'
        +'</div>';
    }).join('');
    return '<div class="card '+(st==='confirmed'?'confirmed':'')+'">'
      +'<div class="row1"><span class="tname">'+esc(t.team_name)+'</span>'+badge+'</div>'
      +(t.slogan?'<div class="meta">“'+esc(t.slogan)+'”</div>':'')
      +'<div class="meta" style="margin-bottom:2px;">멤버 — 티어 바꾸면 💾 저장</div>'
      +(memEdit||'<div class="meta">-</div>')
      +'<div class="meta">팀 BPI: <b>'+esc(t.bpi)+'</b>'+(t.weight!=null?' (가중치 ×'+esc(t.weight)+')':'')+'</div>'
      +(t.unregistered?'<div class="meta" style="color:#fbbf24;">⚠ 등록계 미등록 '+t.unregistered+'명 — 확정 전 팀장에게 정확한 인게임 닉 확인 필요</div>':'')
      +'<div class="contact">📞 연락/입금자: '+esc(t.contact||'-')+'</div>'
      +'<div class="acts">'
      +'<button class="ok" onclick="saveTiers(\''+t.id+'\')">💾 닉·티어 저장 → 재검증</button>'
      +'<button class="ok" onclick="setStatus(\''+t.id+'\',\'confirmed\')">✅ 입금확정</button>'
      +'<button class="wait" onclick="setStatus(\''+t.id+'\',\'applied\')">↩️ 신청대기</button>'
      +'<button class="del" onclick="setStatus(\''+t.id+'\',\'cancelled\')">🗑 취소</button>'
      +'</div></div>';
  }
  var active=teams.filter(function(t){return (t.status||'')!=='cancelled';});
  var canc=teams.filter(function(t){return (t.status||'')==='cancelled';});
  var html=active.length?active.map(card).join(''):'<div class="msg">표시할 팀이 없어요.</div>';
  if(canc.length){
    html+='<details style="margin-top:16px;"><summary style="cursor:pointer;color:var(--ink-faint);font-size:14px;padding:8px 0;">🗑 취소된 팀 '+canc.length+'개 — 펼쳐서 복구(↩️ 신청대기)</summary><div style="opacity:.5;margin-top:8px;">'+canc.map(card).join('')+'</div></details>';
  }
  el.innerHTML=html;
}

// 확정은 서버가 멤버 tier를 재도출·검증한다(멤버당 20초 페이싱 → 최대 ~70초 소요).
// 409=검증 실패(사유·멤버별 차이 표시) · 503=PUBG 장애(재시도 또는 강제확정).
// 강제확정은 감사 기록이 남고 목록에 '미검증'으로 표시된다.
function confirmDenied(d){
  var lines=['❌ 확정 거부 — 서버 재검증 실패'];
  if(d.serverBpi!=null)lines.push('서버 재도출 합산: '+d.serverBpi);
  (d.reasons||[]).forEach(function(r){
    if(r.code==='bpi_cap_exceeded')lines.push('· 합산 '+r.teamBpi+' — 상한 '+r.cap+' 초과 ('+r.over+'점)');
    else if(r.code==='s_tier_limit')lines.push('· S급 '+r.count+'명 — 팀당 '+r.max+'명까지');
    else if(r.code==='player_not_found')lines.push('· 닉을 찾을 수 없음 (idx '+r.idx+')');
    else lines.push('· '+r.code);
  });
  var diffs=(d.members||[]).filter(function(m){return m.mismatch;});
  if(diffs.length){
    lines.push('');
    lines.push('신고 티어와 실제가 다른 멤버:');
    diffs.forEach(function(m){lines.push('· '+m.ign+': 신고 '+m.clientTier+' → 실제 '+m.serverTier);});
  }
  alert(lines.join('\n'));
}
function setStatus(id,status,force){
  var k=getKey(); if(!k)return;
  if(status==='cancelled' && !confirm('이 팀을 취소(명단에서 제외)할까요?'))return;
  if(status==='confirmed'&&!force){
    if(!window.confirm('확정 시 서버가 멤버 전적을 재검증합니다.\n(최대 1분 정도 걸릴 수 있어요 — 창을 닫지 마세요)'))return;
  }
  var body={id:id,status:status};
  if(force){
    var why=window.prompt('강제확정 사유 (감사 기록에 남습니다):','PUBG API 장애');
    if(why===null)return;
    body.force=1; body.force_reason=why;
  }
  fetch(GAPI+"/api/gdcup-confirm",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":k},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(d){return {status:r.status,d:d};});})
  .then(function(res){
    var d=res.d||{};
    if(d.ok){loadAdmin();return;}
    if(res.status===409){confirmDenied(d);return;}
    if(res.status===503){
      if(window.confirm((d.message||'PUBG API 장애로 검증 불가')+'\n\n강제확정할까요? (검증 생략 · 감사 기록됨 · 미검증 표시)'))
        setStatus(id,'confirmed',true);
      return;
    }
    alert('처리 실패: '+(d.error||res.status));
  })
  .catch(function(){alert('네트워크 오류 — 검증이 오래 걸리는 중일 수 있어요. 새로고침 후 상태를 확인해주세요.');});
}

function saveTiers(teamId){
  var k=getKey(); if(!k){alert('키를 입력하세요');return;}
  var sels=document.querySelectorAll('.tier-edit[data-team="'+teamId+'"]');
  if(!sels.length)return;
  var members=[], blank=false;
  sels.forEach(function(s){
    var idx=s.getAttribute('data-idx');
    var inp=document.querySelector('.ign-edit[data-team="'+teamId+'"][data-idx="'+idx+'"]');
    var ign=inp?inp.value.trim():'';
    if(!ign) blank=true;
    members.push({name:s.getAttribute('data-name'),ign:ign,tier:s.value,peak:s.getAttribute('data-peak')||'',dmg:s.getAttribute('data-dmg')||''});
  });
  // 닉이 비면 서버가 그 멤버를 빈 슬롯으로 저장해 팀이 조용히 줄어든다 — 미리 막는다.
  if(blank){alert('빈 닉이 있어요. 모든 멤버의 인게임 닉을 채워주세요.');return;}
  if(!window.confirm('저장 후 서버가 PUBG에서 각 멤버를 재조회해 티어를 다시 판정합니다.\n(멤버당 20초 — 4명이면 1분 정도, 창을 닫지 마세요)'))return;
  var btns=document.querySelectorAll('button[onclick*="saveTiers(\''+teamId+'\')"]');
  btns.forEach(function(b){b.disabled=true;b.textContent='⏳ 검증 중…';});
  fetch(GAPI+"/api/gdcup-edit",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":k},body:JSON.stringify({id:teamId,members:members,verify:true})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d||!d.ok){alert('저장 실패: '+((d&&d.error)||''));loadAdmin();return;}
    var v=d.verify, msg='저장 완료 — 팀 BPI '+d.bpi+' (가중치 ×'+d.weight+')';
    if(v&&v.error){ msg+='\n\n⚠ 재검증 실패: '+(v.message||'')+'\n닉 수정은 저장됐어요. 확정 시 다시 검증됩니다.'; }
    else if(v&&v.apiFailed){ msg+='\n\n⚠ PUBG API 장애로 재검증 보류. 닉 수정은 저장됐어요.'; }
    else if(v&&v.notFound&&v.notFound.length){
      msg+='\n\n❌ 아직 PUBG에서 못 찾는 닉 '+v.notFound.length+'명:\n· '+v.notFound.join('\n· ')
        +'\n\n닉 수정은 저장됐어요. 팀장에게 정확한 인게임 닉을 확인해주세요.';
    }
    else if(v&&v.applied){
      msg+='\n\n✅ 전원 조회 성공 — 서버 판정 티어를 반영했습니다.'
        +'\n'+v.members.map(function(m){return '· '+m.ign+' → '+m.serverTier+(m.mismatch?' (신고 '+m.clientTier+'에서 변경)':'');}).join('\n');
      if(v.teamOk===false){ msg+='\n\n⚠ 팀 구성 규칙 위반: '+(v.teamReasons||[]).map(function(r){return r.code||r;}).join(', '); }
    }
    alert(msg); loadAdmin();
  })
  .catch(function(){alert('네트워크 오류 — 재검증이 오래 걸리는 중일 수 있어요. 새로고침 후 상태를 확인해주세요.');loadAdmin();});
}

function postBoard(){
  var k=getKey(); if(!k){alert('키를 입력하세요');return;}
  fetch(GAPI+"/api/gdcup-board",{method:"POST",headers:{"x-admin-key":k}})
  .then(function(r){return r.json();})
  .then(function(d){ if(d&&d.ok){alert('📋 디코 게시 완료! 모집팀 '+d.teams+'개 · 대기솔로 '+d.solos+'명');} else {alert('실패: '+((d&&d.error)||'webhook 미설정?'));} })
  .catch(function(){alert('네트워크 오류');});
}

function saveSoloTier(id){
  var k=getKey(); if(!k)return;
  var inp=document.querySelector('.solotier[data-id="'+id+'"]'); if(!inp)return;
  fetch(GAPI+"/api/gdcup-solo-tier",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":k},body:JSON.stringify({id:id,tier:inp.value})})
  .then(function(r){return r.json();})
  .then(function(d){ if(d&&d.ok){inp.style.borderColor='var(--green)';} else {alert('실패');} })
  .catch(function(){alert('네트워크 오류');});
}

function loadSolosAdmin(){
  var k=getKey(); if(!k)return;
  fetch(GAPI+"/api/gdcup-solo-admin",{headers:{"x-admin-key":k}})
  .then(function(r){return r.json();}).then(function(d){renderSolos((d&&d.solos)||[]);}).catch(function(){});
}
function renderSolos(solos){
  var el=document.getElementById('soloAdminList'); if(!el)return;
  var act=solos.filter(function(s){return s.status!=='cancelled';});
  if(!act.length){el.innerHTML='<div class="msg">솔로/용병 신청이 없어요.</div>';return;}
  el.innerHTML='<div style="margin-bottom:10px;"><button class="ok" style="padding:7px 12px;" onclick="fetchAllSoloDmg()">🔍 대기자 전원 전시즌 딜 조회 (순차·느림)</button></div>'+act.map(function(s){
    var st=s.status||'waiting';
    var badge=st==='matched'?'<span class="badge b-confirmed">✅ 매칭완료</span>':'<span class="badge b-applied">⏳ 대기</span>';
    var kind=s.kind==='short'?'👥 자리모집':'🙋 솔로';
    return '<div class="card '+(st==='matched'?'confirmed':'')+'">'
      +'<div class="row1"><span class="tname">'+esc(s.ign)+' <span style="font-size:12px;color:var(--ink-faint);font-weight:400;">'+kind+'</span></span>'+badge+'</div>'
      +'<div class="meta" style="display:flex;gap:6px;align-items:center;margin-top:6px;">티어: <input class="solotier" data-id="'+s.id+'" value="'+esc(s.tier||'')+'" placeholder="예: 마스터 / T2" style="flex:1;background:var(--bg-elev);border:1px solid var(--line);color:var(--ink);padding:6px 9px;border-radius:6px;font-size:13px;"><button class="ok" style="padding:6px 10px;" onclick="saveSoloTier('+s.id+')">💾</button></div>'
      +'<div class="meta" id="dmg-'+s.id+'" style="margin-top:4px;">전시즌 딜: <button class="ok" style="padding:4px 9px;font-size:12px;" data-ign="'+esc(s.ign)+'" data-id="'+s.id+'" onclick="fetchSoloDmg(this)">🔍 조회</button></div>'
      +(s.note?'<div class="meta">한마디: '+esc(s.note)+'</div>':'')
      +'<div class="contact">💬 디스코드: '+esc(s.discord||'-')+'</div>'
      +'<div class="acts">'
      +'<button class="ok" onclick="setSolo('+s.id+',\'matched\')">✅ 매칭완료</button>'
      +'<button class="wait" onclick="setSolo('+s.id+',\'waiting\')">↩️ 대기</button>'
      +'<button class="del" onclick="setSolo('+s.id+',\'cancelled\')">🗑 취소</button>'
      +'</div></div>';
  }).join('');
}
function fetchSoloDmg(btn){
  var k=getKey(); if(!k)return;
  var ign=btn.getAttribute('data-ign'); var id=btn.getAttribute('data-id');
  var box=document.getElementById('dmg-'+id); if(!box)return;
  box.innerHTML='전시즌 딜: <span style="color:var(--ink-faint);">조회중… (수 초)</span>';
  var iq=esc(ign);
  return fetch(GAPI+"/api/gdcup-solo-stats?ign="+encodeURIComponent(ign),{headers:{"x-admin-key":k}})
    .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};});})
    .then(function(res){
      var retry=' <button class="ok" style="padding:4px 9px;font-size:12px;" data-ign="'+iq+'" data-id="'+id+'" onclick="fetchSoloDmg(this)">🔍 재시도</button>';
      if(res.s===200 && res.j && res.j.found){
        var d=res.j;
        var plat=d.platform==='kakao'?'카카오':(d.platform==='steam'?'스팀':d.platform);
        var label=(d.source==='prev'?('시즌'+d.seasonNum):'현시즌');
        box.innerHTML='전시즌 딜: <b style="color:var(--gold)">'+d.avgDamage+'</b> <span style="color:var(--ink-faint);font-size:12px;">('+label+' · '+plat+' · '+d.rounds+'판 · 평균 '+d.avgKills+'킬'+(d.tier?(' · '+d.tier):'')+')</span>'+retry;
      } else if(res.s===429){
        box.innerHTML='전시즌 딜: <span style="color:var(--red);">레이트리밋 — 잠시 후</span>'+retry;
      } else {
        box.innerHTML='전시즌 딜: <span style="color:var(--ink-faint);">못 찾음('+((res.j&&res.j.error)||'')+')</span>'+retry;
      }
    }).catch(function(){ box.innerHTML='전시즌 딜: <span style="color:var(--red);">네트워크 오류</span>'; });
}
function fetchAllSoloDmg(){
  var btns=Array.prototype.slice.call(document.querySelectorAll('#soloAdminList [data-ign]'));
  if(!btns.length)return;
  if(!confirm(btns.length+'명을 순차 조회합니다. PUBG 제한(분당 10건) 때문에 1명당 약 9초, 총 '+Math.ceil(btns.length*9/60)+'분쯤 걸려요. 진행할까요?'))return;
  var i=0;
  (function next(){
    if(i>=btns.length)return;
    var b=btns[i++];
    Promise.resolve(fetchSoloDmg(b)).then(function(){ setTimeout(next, 9000); });
  })();
}
function setSolo(id,status){
  var k=getKey(); if(!k)return;
  if(status==='cancelled' && !confirm('이 신청을 취소(명단에서 제외)할까요?'))return;
  fetch(GAPI+"/api/gdcup-solo-status",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":k},body:JSON.stringify({id:id,status:status})})
  .then(function(r){return r.json();}).then(function(d){if(d&&d.ok)loadSolosAdmin();else alert('처리 실패');}).catch(function(){alert('네트워크 오류');});
}

// 세션에 저장된 키 있으면 자동 로드
(function(){
  // 시즌 목록을 먼저 받아 SEASON을 확정한 뒤 조회한다 — 순서가 뒤바뀌면 첫 조회가 시즌 없이 나간다.
  var k=null; try{ k=sessionStorage.getItem('gdcupKey'); }catch(e){}
  if(k){ try{ document.getElementById('key').value=k; }catch(e){} }
  loadSeasons().then(function(){ if(k)loadAdmin(); });
})();
</script>
